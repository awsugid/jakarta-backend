[package]
name = "jakarta-backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.123"
js-sys = "0.3"
console_error_panic_hook = "0.1"
jsonwebtoken = "9"
base64 = "0.21"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = "s"
