name = "jakarta-backend"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"

[build]
command = "cargo install -q worker-build && worker-build --release"

[vars]
FORMBRICKS_BASE_URL = "https://forms.awscommunity.id"
ALLOWED_ORIGINS = "https://jakarta.awscommunity.id"

[[d1_databases]]
binding = "DB"
database_name = "jakarta-backend-db"
database_id = "placeholder-change-me"
